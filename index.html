<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alca Canva — Studio Desain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="top-left">
    <a class="brand" href="#" onclick="return false">Alca<em>.</em>Canva</a>
    <span class="tag" id="docSize">1080 × 1080</span>
  </div>
  <div class="top-center">
    <button class="tb-btn" id="undoBtn" onclick="undo()" title="Undo (Ctrl+Z)">↶</button>
    <button class="tb-btn" id="redoBtn" onclick="redo()" title="Redo (Ctrl+Y)">↷</button>
    <button class="tb-btn" onclick="zoomOut()">−</button>
    <span class="zoom-val" id="zoomVal">100%</span>
    <button class="tb-btn" onclick="zoomIn()">+</button>
    <button class="tb-btn" onclick="zoomFit()">⤢</button>
  </div>
  <div class="top-right">
    <button class="btn-ghost" onclick="newDesign()">+ Baru</button>
    <button class="btn-primary" onclick="openExport()">⬇ Export</button>
  </div>
</header>

<main class="workspace">
  <!-- PANEL KIRI -->
  <aside class="sidebar left">
    <div class="side-tabs">
      <button class="side-tab active" onclick="switchTab('templates', this)">📐 Ukuran</button>
      <button class="side-tab" onclick="switchTab('elements', this)">✦ Elemen</button>
      <button class="side-tab" onclick="switchTab('text', this)">T Teks</button>
      <button class="side-tab" onclick="switchTab('uploads', this)">🖼 Gambar</button>
    </div>
    
    <div class="side-panel active" id="panel-templates">
      <h3 class="panel-h">Ukuran Kanvas</h3>
      <div class="preset-grid" id="presetGrid"></div>
    </div>
    
    <div class="side-panel" id="panel-elements">
      <h3 class="panel-h">Shapes</h3>
      <div class="shape-grid" id="shapeGrid"></div>
      <h3 class="panel-h">Icons</h3>
      <div class="shape-grid" id="iconGrid"></div>
    </div>
    
    <div class="side-panel" id="panel-text">
      <h3 class="panel-h">Tambah Teks</h3>
      <button class="block-btn big" onclick="addText('heading')">+ Heading</button>
      <button class="block-btn" onclick="addText('subtext')">+ Subheading</button>
      <button class="block-btn" onclick="addText('body')">+ Body Text</button>
    </div>
    
    <div class="side-panel" id="panel-uploads">
      <h3 class="panel-h">Upload Gambar</h3>
      <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" accept="image/*" onchange="handleUpload(event)">
        <div class="drop-icon">🖼</div>
        <div class="drop-txt">Klik untuk upload</div>
      </div>
    </div>
  </aside>

  <!-- AREA CANVAS -->
  <section class="canvas-area" id="canvasArea" onmousedown="startDrag(event)" ontouchstart="startDrag(event)">
    <div class="canvas-stage" id="canvasStage">
      <canvas id="mainCanvas"></canvas>
    </div>
  </section>

  <!-- PANEL KANAN -->
  <aside class="sidebar right">
    <div class="side-tabs">
      <button class="side-tab active" onclick="switchRTab('props', this)">⚙ Properti</button>
      <button class="side-tab" onclick="switchRTab('layers', this)">▤ Layer</button>
    </div>
    <div class="side-panel active" id="panel-props">
      <div id="propsEmpty" class="empty-props">Pilih elemen untuk edit</div>
      <div id="propsContent" hidden></div>
    </div>
    <div class="side-panel" id="panel-layers">
      <h3 class="panel-h">Layers</h3>
      <div class="layers-list" id="layersList"></div>
    </div>
  </aside>
</main>

<!-- MODAL EXPORT -->
<div class="modal" id="exportModal" hidden>
  <div class="modal-box">
    <h2 class="modal-title">Export Desain</h2>
    <label class="lbl">Format</label>
    <select id="exportFmt">
      <option value="png">PNG</option>
      <option value="jpeg">JPEG</option>
    </select>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeExport()">Batal</button>
      <button class="btn-primary" onclick="doExport()">Download</button>
    </div>
  </div>
</div>

<script src="js/editor.js"></script>
</body>
</html>
